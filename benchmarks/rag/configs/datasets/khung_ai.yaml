# Acceptance workbook "Bộ test Chatbot – Khung nội dung giáo dục AI" -> golden JSONL.
# python -m rag_benchmark.cli import-xlsx <workbook.xlsx> --config benchmarks/rag/configs/datasets/khung_ai.yaml \
#     --out benchmarks/rag/datasets/acceptance/khung_ai_v2.jsonl

sheet: "Bộ câu hỏi"
dataset_version: "khung-ai-v2"
domain: "khung_ai"

columns:
  case_id: "Mã câu"
  group: "Mã nhóm"
  category: "Nhóm vấn đề"
  kind: "Loại"
  question: "Câu hỏi nhập vào bot"
  expected_answer: "Đáp án kỳ vọng"
  reference: "Căn cứ (mã YCCĐ)"
  fail_conditions: "FAIL nếu"
  # Earlier graded run: becomes judge calibration examples.
  human_answer: "Câu trả lời của bot"
  human_result: "Kết quả"
  human_notes: "Ghi chú"

human_pass_values: ["Đạt"]
human_fail_values: ["Không đạt"]

# A reference of "—" means the documents do not contain the answer; "Phiếu KS …" points to the
# survey requirement (privacy, hand-off), not to the documents.
unanswerable_reference_regex: '^\s*[—–-]?\s*$|^\s*Phiếu\s*KS'
# Codes the graded answer must contain verbatim: those in the reference and in the expected answer.
required_identifiers_from: [reference, expected_answer]
# Cases whose expected answer names codes only as examples / alternatives ("ví dụ", "hoặc", "hoặc hỏi lại"):
# the required list is set explicitly; the judge grades the rest.
required_identifiers_overrides:
  G13-04: []                          # 6.A1.* are examples of the coding convention
  G15-05: []                          # listing the existing D2 codes is optional
  G23-03: []                          # the two convention examples are optional
  G24-03: []                          # asking which grade is an accepted answer
  G26-01: [11.C3.MR3, 11.C3.MR4]      # 11.C3.1 is one possible suggestion
  G26-02: [11.C5.1, 11.C5.MR1]        # 11.C5.2 / 11.C5.MR2 are suggestions
  G26-03: [12.A2.1]                   # 12.A2.MR1 or 10.B3.1 as suggestion
  G26-05: [10.C4.1, 10.C4.MR1]        # grade-12 codes are suggestions

# Multi-turn cells: "Lượt 1: … / Lượt 2: …"; separate sessions: "(1) … (2) …".
turn_regex: '^\s*Lượt\s*\d+\s*:\s*(.+)$'
variant_regex: '^\s*\(\d+\)\s*(.+)$'

# Critical groups: any failure blocks go-live (exact citations, no fabrication, privacy, exact names).
must_pass_groups: [G11, G14, G15, G16, G30]
