# Go-live quality gate for the RAG chatbot (rag_benchmark.cli suite/gate --gate this-file).
# Blocking criteria decide the exit code: any failure = NO-GO.

min_cases: 100                 # a smaller set cannot support a 95% claim
min_pass_rate: 0.95            # overall share of cases passed (human verdict > checks > calibrated judge)
min_pass_rate_ci_low: null     # e.g. 0.90: also require the Wilson 95% lower bound (needs a larger set)
min_group_pass_rate: 0.80      # every problem group: one weak area must not hide behind the average
must_pass_all: true            # critical cases (must_pass in the dataset) pass 100%
max_review: 0                  # every case has a verdict (no "needs review" left)
max_errors: 0                  # API / infrastructure errors during the run
max_unanswerable_failed: 0     # answered / fabricated when the documents have no answer
max_wrongly_refused: null      # e.g. 2: refusals although gold evidence exists
max_regressions: 0             # cases that passed in the --baseline run and fail now

judge:
  require_calibration: true    # judge verdicts count only with a calibration of the same model + rubric
  min_examples: 30
  min_agreement: 0.85          # judge vs human agreement
  max_false_pass_rate: 0.10    # judge "pass" where a person said "fail"

latency:
  enforce: false               # report-only until the latency target is the release criterion
  p95_total_s: 8.0
  p95_ttft_s: 3.0
