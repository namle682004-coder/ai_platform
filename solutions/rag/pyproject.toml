[project]
name = "rag-worker"
version = "0.1.0"
description = "AIP Distributed RAG Ingestion Worker"
requires-python = ">=3.10"
dependencies = [
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "flashrank>=0.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

