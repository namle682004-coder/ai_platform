[project]
name = "rag-worker"
version = "0.1.0"
description = "AIP Enterprise RAG service: REST API (port 8010) and ingestion worker"
requires-python = ">=3.10"
dependencies = [
    "aio-pika>=9.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "motor>=3.4.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "flashrank>=0.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Code is imported as `solutions.rag` from the repo root via PYTHONPATH;
# this project only declares dependencies, so there is nothing to ship.
[tool.hatch.build.targets.wheel]
bypass-selection = true

