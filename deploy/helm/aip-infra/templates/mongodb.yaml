apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aip-mongodb
  namespace: aip-infra
  labels:
    app.kubernetes.io/name: aip-mongodb
    app.kubernetes.io/component: database
spec:
  serviceName: aip-mongodb
  replicas: {{ .Values.mongodb.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aip-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aip-mongodb
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aip-mongodb-secret
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aip-mongodb-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mongodb.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mongodb.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: aip-mongodb
  namespace: aip-infra
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: mongo
  selector:
    app.kubernetes.io/name: aip-mongodb
