# ==========================================
# AIP Infrastructure Helm Values
# ==========================================

mongodb:
  image: mongo:7.0
  replicas: 3
  storage: 50Gi
  storageClass: gp3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

redis:
  image: redis:7.2-alpine
  replicas: 3
  maxMemory: 512mb
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

rabbitmq:
  image: rabbitmq:3.13-management-alpine
  replicas: 3
  storage: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

minio:
  image: minio/minio:RELEASE.2024-05-10T01-41-38Z
  replicas: 4
  storage: 100Gi
  storageClass: gp3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
