{{- range $name, $svc := dict "stt" .Values.stt "tts" .Values.tts "translation" .Values.translation "moderation" .Values.moderation "ocr" .Values.ocr }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aip-{{ $name }}
  labels:
    app.kubernetes.io/name: aip-{{ $name }}
    app.kubernetes.io/component: ai-runtime
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aip-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aip-{{ $name }}
    spec:
      nodeSelector:
        {{- toYaml $svc.nodeSelector | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: AIP_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: aip-common-secrets
                  key: mongo-uri
            - name: AIP_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: aip-common-secrets
                  key: redis-uri
            - name: AIP_RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: aip-common-secrets
                  key: rabbitmq-uri
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aip-{{ $name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: aip-{{ $name }}
{{- end }}
{{- end }}
