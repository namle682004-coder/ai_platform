# ==========================================
# AIP Enterprise Helm Values Configuration
# ==========================================

replicaCount: 3

image:
  repository: aip-platform/gateway
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Kubernetes Namespaces Topology (SRS Section 2.4)
namespaces:
  control: aip-control
  text: aip-text
  multimodal: aip-multimodal
  video: aip-video
  infra: aip-infra
  observability: aip-observability

# Kubernetes Node Pools & Taints/Tolerations (SRS Section 11.3)
nodeSelector:
  pool: control-plane

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - aip-gateway
          topologyKey: "kubernetes.io/hostname"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: aip-api.enterprise.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aip-api-tls
      hosts:
        - aip-api.enterprise.internal

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

env:
  ENVIRONMENT: production
  DEBUG: "false"
  DEFAULT_RPM_LIMIT: "300"
  DEFAULT_TPM_LIMIT: "500000"
  DEFAULT_CONCURRENCY_LIMIT: "20"
