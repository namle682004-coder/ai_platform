services:
  mongodb:
    image: mongo:6.0
    container_name: aip-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: aip-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_secret}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    build:
      context: ../../infrastructure/rabbitmq
      dockerfile: Dockerfile
    container_name: aip-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"  # Prometheus metrics port
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aip}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aip_dev_secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-aip}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aip-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: aip-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped


  prometheus:
    profiles: ["monitoring", "all"]
    image: prom/prometheus:v2.45.0
    container_name: aip-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infrastructure/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  alertmanager:
    profiles: ["monitoring", "all"]
    image: prom/alertmanager:v0.25.0
    container_name: aip-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../../infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped

  grafana:
    profiles: ["monitoring", "all"]
    image: grafana/grafana:10.0.3
    container_name: aip-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../infrastructure/grafana/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  control-plane:
    build:
      context: ../..
      dockerfile: platform/gateway/Dockerfile
    container_name: aip-control-plane
    ports:
      - "8000:8000"
    working_dir: /app/platform/gateway
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app:/app/platform/gateway:/app/packages/common:/app/packages/contracts
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - AIP_API_KEY=${AIP_API_KEY:-}
      - AIP_RUNTIME_TOKEN=${AIP_RUNTIME_TOKEN:-}
      - ALLOW_IN_PROCESS_FALLBACK=${ALLOW_IN_PROCESS_FALLBACK:-false}
      - MASTER_PEPPER=${MASTER_PEPPER:-test-master-pepper-for-testing-purposes-min-32-chars}
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-for-testing-purposes-min-32-chars}
      - MONGO_URI=${MONGO_URI:-mongodb+srv://namle:1234@namle.52nsi1k.mongodb.net/ai_platform?appName=namle}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_dev_secret}@redis:6379/0}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://aip:${RABBITMQ_PASSWORD:-aip_dev_secret}@rabbitmq:5672/aip}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_ENDPOINT=http://minio:9000
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_GRPC_TARGET=host.docker.internal:50058
      - VLLM_SERVER_URL=http://host.docker.internal:8001/v1
      - TRANSLATION_SERVER_URL=http://host.docker.internal:8003
      - STT_SERVER_URL=http://host.docker.internal:8002
      - OCR_SERVER_URL=http://host.docker.internal:8004
      - MODERATION_SERVER_URL=http://host.docker.internal:8006
      - TTS_SERVER_URL=http://host.docker.internal:8007
    volumes:
      - ../../platform/gateway:/app/platform/gateway
      - ../../solutions/rag:/app/solutions/rag
      - ../../frontend:/app/frontend:ro
      - ../../packages/common:/app/packages/common
      - ../../packages/contracts:/app/packages/contracts
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: aip-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://control-plane:8000
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - control-plane
    restart: unless-stopped

  dispatcher-worker:
    build:
      context: ../..
      dockerfile: platform/workers/dispatcher/Dockerfile
    container_name: aip-dispatcher-worker
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app:/app/platform/workers/dispatcher:/app/platform/workers/dispatcher/src:/app/packages/common:/app/packages/contracts
      - MASTER_PEPPER=${MASTER_PEPPER:-test-master-pepper-for-testing-purposes-min-32-chars}
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-for-testing-purposes-min-32-chars}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://aip:${RABBITMQ_PASSWORD:-aip_dev_secret}@rabbitmq:5672/aip}
      - MONGO_URI=${MONGO_URI:-mongodb+srv://namle:1234@namle.52nsi1k.mongodb.net/ai_platform?appName=namle}
      - VLLM_GRPC_TARGET=host.docker.internal:50051
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../platform/workers/dispatcher/src:/app/platform/workers/dispatcher/src
      - ../../packages/common:/app/packages/common
      - ../../packages/contracts:/app/packages/contracts
    depends_on:
      - rabbitmq
    command: ["python", "-m", "src.main"]
    restart: unless-stopped

  callback-worker:
    build:
      context: ../..
      dockerfile: platform/workers/callback/Dockerfile
    container_name: aip-callback-worker
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app/platform/workers/callback:/app/packages/common:/app/packages/contracts
      - MASTER_PEPPER=${MASTER_PEPPER:-test-master-pepper-for-testing-purposes-min-32-chars}
      - JWT_SECRET=${JWT_SECRET:-test-jwt-secret-for-testing-purposes-min-32-chars}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://aip:${RABBITMQ_PASSWORD:-aip_dev_secret}@rabbitmq:5672/aip}
      - MONGO_URI=${MONGO_URI:-mongodb+srv://namle:1234@namle.52nsi1k.mongodb.net/ai_platform?appName=namle}
    volumes:
      - ../../platform/workers/callback/worker:/app/platform/workers/callback/worker
      - ../../packages/common:/app/packages/common
      - ../../packages/contracts:/app/packages/contracts
    depends_on:
      - rabbitmq
    restart: unless-stopped

  rag-worker:
    build:
      context: ../..
      dockerfile: solutions/rag/Dockerfile
    container_name: aip-rag-worker
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app:/app/solutions/rag:/app/packages/common:/app/packages/contracts
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://aip:${RABBITMQ_PASSWORD:-aip_dev_secret}@rabbitmq:5672/aip}
      - MONGO_URI=${MONGO_URI:-mongodb+srv://namle:1234@namle.52nsi1k.mongodb.net/ai_platform?appName=namle}
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../solutions/rag:/app/solutions/rag
      - ../../packages/common:/app/packages/common
      - ../../packages/contracts:/app/packages/contracts
    command: ["python", "solutions/rag/worker.py"]
    depends_on:
      - rabbitmq
      - qdrant
    restart: unless-stopped

  image-worker:
    profiles: ["ai-specialized", "gpu-workers", "all"]
    build:
      context: ../..
      dockerfile: platform/workers/media/image-worker/Dockerfile
    container_name: aip-image-worker
    environment:
      - ENVIRONMENT=development
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://aip:${RABBITMQ_PASSWORD:-aip_dev_secret}@rabbitmq:5672/aip}
      - AIP_IMAGE_QUEUE=q.aip.tasks.image
    volumes:
      - ../../platform/workers/media/image-worker:/app/platform/workers/media/image-worker
      - ../../packages/common/common:/app/packages/common/common
      - ../../packages/contracts/contracts:/app/packages/contracts/contracts
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # ─── Data Plane: Unified Inference & Specialized AI Microservices ───
  vllm-engine:
    profiles: ["ai-llm", "all"]
    build:
      context: ../..
      dockerfile: platform/runtimes/vllm-engine/Dockerfile
    container_name: aip-vllm-engine
    expose:
      - "8001"
    environment:
      - PORT=8001
      - AIP_RUNTIME_TOKEN=${AIP_RUNTIME_TOKEN:-}
      - MODEL_NAME=${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      - HF_HOME=/root/.cache/huggingface
      - TORCH_DTYPE=float16
      - TEST_MODE=${VLLM_TEST_MODE:-false}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ../../platform/runtimes/vllm-engine:/app/platform/runtimes/vllm-engine
      - ../../packages/common/common:/app/packages/common/common
      - ../../packages/contracts/contracts:/app/packages/contracts/contracts
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  translation-server:
    profiles: ["ai-specialized", "all"]
    build:
      context: ../..
      dockerfile: platform/runtimes/translation-server/Dockerfile
    container_name: aip-translation-server
    expose:
      - "8003"
    environment:
      - PORT=8003
      - AIP_RUNTIME_TOKEN=${AIP_RUNTIME_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ../../platform/runtimes/translation-server:/app/platform/runtimes/translation-server
      - ../../packages/common/common:/app/packages/common/common
      - ../../packages/contracts/contracts:/app/packages/contracts/contracts
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    restart: unless-stopped

  stt-server:
    profiles: ["ai-specialized", "all"]
    build:
      context: ../..
      dockerfile: platform/runtimes/stt-server/Dockerfile
    container_name: aip-stt-server
    expose:
      - "8002"
    environment:
      - PORT=8002
      - AIP_RUNTIME_TOKEN=${AIP_RUNTIME_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ../../platform/runtimes/stt-server:/app/platform/runtimes/stt-server
      - ../../packages/common/common:/app/packages/common/common
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    restart: unless-stopped

  ocr-server:
    profiles: ["ai-specialized", "all"]
    build:
      context: ../..
      dockerfile: platform/runtimes/ocr-server/Dockerfile
    container_name: aip-ocr-server
    expose:
      - "8004"
    environment:
      - PORT=8004
      - AIP_RUNTIME_TOKEN=${AIP_RUNTIME_TOKEN:-}
    volumes:
      - ../../platform/runtimes/ocr-server:/app/platform/runtimes/ocr-server
      - ../../packages/common/common:/app/packages/common/common
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8004", "--reload"]
    restart: unless-stopped

  moderation-server:
    profiles: ["ai-specialized", "all"]
    build:
      context: ../..
      dockerfile: platform/runtimes/moderation-server/Dockerfile
    container_name: aip-moderation-server
    expose:
      - "8006"
    environment:
      - PORT=8006
      - AIP_RUNTIME_TOKEN=${AIP_RUNTIME_TOKEN:-}
    volumes:
      - ../../platform/runtimes/moderation-server:/app/platform/runtimes/moderation-server
      - ../../packages/common/common:/app/packages/common/common
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8006", "--reload"]
    restart: unless-stopped

  tts-adapter:
    profiles: ["ai-specialized", "all"]
    build:
      context: ../..
      dockerfile: platform/runtimes/tts-adapter/Dockerfile
    container_name: aip-tts-adapter
    expose:
      - "8007"
    environment:
      - PORT=8007
      - AIP_RUNTIME_TOKEN=${AIP_RUNTIME_TOKEN:-}
    volumes:
      - ../../platform/runtimes/tts-adapter:/app/platform/runtimes/tts-adapter
      - ../../packages/common/common:/app/packages/common/common
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8007", "--reload"]
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
