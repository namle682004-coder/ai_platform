services:
  mongodb:
    image: mongo:7.0
    container_name: aip-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: aip-redis
    command: redis-server --requirepass example
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aip-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: aip-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  aip-gateway:
    build:
      context: ../..
      dockerfile: services/aip-gateway/Dockerfile
    container_name: aip-gateway-service
    ports:
      - "8000:8000"
    environment:
      - AIP_MONGO_URI=mongodb://root:example@mongodb:27017
      - AIP_REDIS_URI=redis://:example@redis:6379/0
      - AIP_RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongodb
      - redis
      - rabbitmq

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
