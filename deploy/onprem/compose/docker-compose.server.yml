# Internal company server (msp / 172.16.20.2) — application stack.
#
# Infra (Redis, RabbitMQ, MinIO, Qdrant) already runs there as compose project `aip-infra`;
# these services join its network and reach it by container name. Models run on the host:
# chat (llama.cpp) on :8011, embedding + rerank (platform/runtimes/embedding-server) on :8012.
#
# Only the gateway is published (:8000, LAN). Teams call /v1/rag/* and /v1/knowledge/* there
# with their own API key; the RAG API (:8010) is reachable only from this Docker network.
#
# Every container has a memory cap: on the 8 GB host an uncapped container can starve the model
# runtimes and the host itself (incident 2026-11-05). Model runtimes: deploy/onprem/host/scripts/install.sh.
#
# Deploy with scripts/deploy_server.sh. Secrets live on the server in $AIP_ENV_FILE
# (see deploy/onprem/compose/server.env.example), never in this repo.

name: aip-app

x-aip-env: &aip-env
  env_file:
    - ${AIP_ENV_FILE:?set AIP_ENV_FILE to the server env file}

services:
  gateway:
    <<: *aip-env
    build:
      context: ../../..
      dockerfile: platform/gateway/Dockerfile
    image: aip/gateway:${AIP_VERSION:-latest}
    container_name: aip-gateway
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "8000:8000"
    environment:
      - RAG_SERVICE_URL=http://aip-rag-api:8010
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped

  litellm:
    <<: *aip-env
    image: ghcr.io/berriai/litellm:main-latest
    container_name: aip-litellm
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "4000:4000"
    volumes:
      - ./configs/litellm/litellm_config.yaml:/app/config.yaml:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AIP_MASTER_KEY=${AIP_MASTER_KEY:-sk-aip-master-key-lenam2026}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  rag-api:
    <<: *aip-env
    build:
      context: ../../..
      dockerfile: solutions/rag/Dockerfile
    image: aip/rag:${AIP_VERSION:-latest}
    container_name: aip-rag-api
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "8010:8010"
    command: ["python", "-m", "solutions.rag.main", "--mode", "api", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      # Identity headers are trusted only together with AIP_RUNTIME_TOKEN (sent by the gateway).
      - RAG_TRUST_IDENTITY_HEADERS=false
      - RAG_ENFORCE_SHARED_KB_WRITE_ACL=true
      # Centralized LiteLLM Router (Local Qwen2.5 ⇄ Gemini Free ⇄ Cloud)
      - RAG_LLM_URL=${RAG_LLM_URL:-http://aip-litellm:4000/v1}
      # Concurrency & Inflight tuned for 32 GB RAM host & llama-server --parallel 4
      - RAG_LLM_MAX_CONCURRENT=4
      - RAG_CHAT_MAX_INFLIGHT=12
      - RAG_CHAT_GLOBAL_RATE_LIMIT_PER_MINUTE=60
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped

  rag-worker:
    <<: *aip-env
    image: aip/rag:${AIP_VERSION:-latest}
    container_name: aip-rag-worker
    mem_limit: 1536m
    memswap_limit: 1536m
    command: ["python", "solutions/rag/worker.py"]
    depends_on:
      rag-api:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: aip-nginx
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./configs/certs:/etc/nginx/certs:ro
    depends_on:
      gateway:
        condition: service_healthy

networks:
  default:
    name: aip-infra_default
    external: true
