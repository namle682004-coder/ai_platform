# ==============================================================================
# AIP (AI Platform) - Centralized Model Gateway (LiteLLM)
# ==============================================================================
# Kiến trúc chuẩn Enterprise AI Platform:
# - Cung cấp định danh Profile chuẩn hệ thống (aip-text-vision-v1, aip-cloud-text-vision-v1)
# - Định tuyến thông minh: Ưu tiên Local Model trên GPU công ty (172.16.20.2:8011)
# - Tự động Fallback mượt mà sang Gemini Free API khi Local nghẽn tải / bảo trì
# - Khóa chặt cấu hình bảo mật: Chặn client-side credentials override, drop_params: false
# ==============================================================================

model_list:
  # ----------------------------------------------------------------------------
  # 1. AIP LOCAL PROFILES (Host TITAN Xp :8011 - Qwen2.5-7B-Instruct)
  # ----------------------------------------------------------------------------
  - model_name: aip-text-vision-v1
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_base: http://172.16.20.2:8011/v1
      api_key: "none"
      timeout: 60

  - model_name: chat-general-standard
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_base: http://172.16.20.2:8011/v1
      api_key: "none"
      timeout: 60

  - model_name: qwen2.5-7b-local
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_base: http://172.16.20.2:8011/v1
      api_key: "none"
      timeout: 60

  # ----------------------------------------------------------------------------
  # 2. AIP CLOUD PROFILES (Google Gemini Free / Cloud API)
  # ----------------------------------------------------------------------------
  - model_name: aip-cloud-text-vision-v1
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 4096
      temperature: 0.2

  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 4096
      temperature: 0.2

  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 4096
      temperature: 0.2

  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 4096
      temperature: 0.2

  # ----------------------------------------------------------------------------
  # 3. SECONDARY ENTERPRISE CLOUD (Claude / GPT-4o)
  # ----------------------------------------------------------------------------
  - model_name: chat-general-pro
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096
      temperature: 0.2

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096
      temperature: 0.2

  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096
      temperature: 0.2

  # ----------------------------------------------------------------------------
  # 4. INTENT & QUERY REWRITING (Siêu tốc <400ms, Xử lý Tiếng Việt)
  # ----------------------------------------------------------------------------
  - model_name: chat-fast
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 1024
      temperature: 0.0

  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 500
      temperature: 0.0

# ------------------------------------------------------------------------------
# ROUTER & HIGH AVAILABILITY SETTINGS
# ------------------------------------------------------------------------------
router_settings:
  routing_strategy: "latency-based-routing"
  num_retries: 2
  timeout: 60
  allowed_fails: 2
  cooldown_time: 30

# Tự động chuyển hướng khi server nội bộ bị nghẽn GPU/OOM/timeout
fallbacks:
  - chat-general-standard: ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-pro"]
  - chat-fast: ["gemini-1.5-flash", "gpt-4o-mini"]

# ------------------------------------------------------------------------------
# AIP GOVERNANCE & SECURITY
# ------------------------------------------------------------------------------
general_settings:
  master_key: os.environ/AIP_MASTER_KEY
  store_model_in_db: false   # Quản lý bằng file manifest/GitOps (ngăn cạnh tranh DB)
  drop_params: false         # Không nuốt tham số không hỗ trợ

litellm_settings:
  allow_client_side_credentials: false  # Chặn client gửi api_key / api_base ghi đè
  telemetry: false                      # Không gửi dữ liệu nội bộ ra ngoài
