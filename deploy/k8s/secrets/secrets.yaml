# External Secrets Operator resources.
# Provision the referenced ClusterSecretStore and remote records before applying.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aip-mongodb-secret
  namespace: aip-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aip-platform
    kind: ClusterSecretStore
  target:
    name: aip-mongodb-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: aip-platform/mongodb
        property: username
    - secretKey: password
      remoteRef:
        key: aip-platform/mongodb
        property: password
---
