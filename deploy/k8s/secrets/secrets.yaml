# =============================================================================
# AIP Kubernetes Secrets Manifests
# Note: For production clusters, encrypt with SealedSecrets (kubeseal),
# SOPS, or synchronize via External Secrets Operator with HashiCorp Vault/AWS Secrets Manager.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-mongodb-secret
  namespace: aip-infra
  labels:
    app.kubernetes.io/part-of: aip-platform
    app.kubernetes.io/component: database
type: Opaque
stringData:
  username: aip_root
  password: aip_mongo_secure_password_prod
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-redis-secret
  namespace: aip-infra
  labels:
    app.kubernetes.io/part-of: aip-platform
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  password: aip_redis_secure_password_prod
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-rabbitmq-secret
  namespace: aip-infra
  labels:
    app.kubernetes.io/part-of: aip-platform
    app.kubernetes.io/component: broker
type: Opaque
stringData:
  username: aip
  password: aip_rabbitmq_secure_password_prod
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-minio-secret
  namespace: aip-infra
  labels:
    app.kubernetes.io/part-of: aip-platform
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  username: minioadmin
  password: aip_minio_secure_password_prod
---
# 1. Control Plane Secret (Namespace: aip-control)
apiVersion: v1
kind: Secret
metadata:
  name: aip-common-secrets
  namespace: aip-control
  labels:
    app.kubernetes.io/part-of: aip-platform
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  mongo-uri: mongodb://aip_root:aip_mongo_secure_password_prod@mongodb.aip-infra.svc.cluster.local:27017/ai_platform?authSource=admin
  redis-uri: redis://:aip_redis_secure_password_prod@redis.aip-infra.svc.cluster.local:6379/0
  rabbitmq-uri: amqp://aip:aip_rabbitmq_secure_password_prod@rabbitmq.aip-infra.svc.cluster.local:5672/aip
  jwt-secret: aip-prod-jwt-secret-min32-characters-required-2026
  master-pepper: aip-prod-master-pepper-min32-chars-security-2026
---
