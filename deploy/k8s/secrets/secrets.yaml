# Sealed Secrets / External Secrets templates
# In production, use: kubeseal < secret.yaml > sealed-secret.yaml
# Or use External Secrets Operator with AWS Secrets Manager / HashiCorp Vault
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-mongodb-secret
  namespace: aip-infra
type: Opaque
stringData:
  username: CHANGE_ME_MONGO_USER
  password: CHANGE_ME_MONGO_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-redis-secret
  namespace: aip-infra
type: Opaque
stringData:
  password: CHANGE_ME_REDIS_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-rabbitmq-secret
  namespace: aip-infra
type: Opaque
stringData:
  username: CHANGE_ME_RABBITMQ_USER
  password: CHANGE_ME_RABBITMQ_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-minio-secret
  namespace: aip-infra
type: Opaque
stringData:
  username: CHANGE_ME_MINIO_USER
  password: CHANGE_ME_MINIO_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-common-secrets
  namespace: aip-control
type: Opaque
stringData:
  mongo-uri: mongodb://user:password@aip-mongodb.aip-infra.svc:27017
  redis-uri: redis://:password@aip-redis.aip-infra.svc:6379/0
  rabbitmq-uri: amqp://user:password@aip-rabbitmq.aip-infra.svc:5672/
---
apiVersion: v1
kind: Secret
metadata:
  name: aip-common-secrets
  namespace: aip-multimodal
type: Opaque
stringData:
  mongo-uri: mongodb://user:password@aip-mongodb.aip-infra.svc:27017
  redis-uri: redis://:password@aip-redis.aip-infra.svc:6379/0
  rabbitmq-uri: amqp://user:password@aip-rabbitmq.aip-infra.svc:5672/
