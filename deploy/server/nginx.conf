# Nginx Reverse Proxy for AIP Enterprise RAG & Platform
# Supports https://rag.cyber.internal and direct IP https://172.16.20.2

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name rag.cyber.internal aip.cyber.internal dcp.cyber.internal api.cyber.internal 172.16.20.2;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name rag.cyber.internal aip.cyber.internal dcp.cyber.internal api.cyber.internal 172.16.20.2;

    ssl_certificate /etc/nginx/certs/cyber_internal.crt;
    ssl_certificate_key /etc/nginx/certs/cyber_internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow document uploads up to 50MB (RAG PDF, DOCX, XLSX)
    client_max_body_size 50M;

    location / {
        proxy_pass http://aip-gateway:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Crucial for SSE Streaming in RAG Chatbot:
        # Disables response buffering so LLM tokens stream immediately to the client
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts for long LLM reasoning & multi-hop generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
