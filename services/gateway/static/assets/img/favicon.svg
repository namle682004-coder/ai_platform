<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00a4b8" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Circular Background -->
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  
  <!-- Neural Network Hexagon Nodes & Links -->
  <g filter="url(#neonGlow)" stroke="url(#glowGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagon Skeleton -->
    <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke-opacity="0.8"/>
    <!-- Inner Connections -->
    <path d="M50,15 L50,85" stroke-opacity="0.6"/>
    <path d="M20,32 L80,68" stroke-opacity="0.6"/>
    <path d="M80,32 L20,68" stroke-opacity="0.6"/>
    <path d="M35,30 L65,70 M65,30 L35,70" stroke-width="3.5"/>
  </g>
  
  <!-- Glowing Nodes Circles -->
  <g fill="url(#glowGrad)" filter="url(#neonGlow)">
    <circle cx="50" cy="15" r="5" />
    <circle cx="80" cy="32" r="5" />
    <circle cx="80" cy="68" r="5" />
    <circle cx="50" cy="85" r="5" />
    <circle cx="20" cy="68" r="5" />
    <circle cx="20" cy="32" r="5" />
    <circle cx="50" cy="50" r="7" />
  </g>
</svg>
