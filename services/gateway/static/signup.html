<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everwin AI Platform - Sign Up</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --fpt-cyan: #00a4b8;
            --fpt-cyan-dark: #008496;
            --fpt-blue: #0062d6;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-dark: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .auth-header { text-align: center; margin-bottom: 28px; }

        .brand-badge {
            display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-heading);
            font-size: 24px; font-weight: 800; color: var(--fpt-cyan); margin-bottom: 8px; text-decoration: none;
        }

        .auth-title { font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
        .auth-subtitle { font-size: 13.5px; color: var(--text-sub); }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 6px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 14px; color: #94a3b8; font-size: 14px; pointer-events: none; }
        .toggle-password { position: absolute; right: 14px; color: #64748b; font-size: 15px; cursor: pointer; transition: color 0.15s; }
        .toggle-password:hover { color: var(--fpt-cyan); }

        .form-control {
            width: 100%; padding: 11px 40px 11px 40px; border-radius: 8px;
            border: 1px solid var(--border-color); font-size: 13.5px; outline: none;
            background: #ffffff; color: var(--text-dark); transition: all 0.2s ease;
        }

        .form-control:focus { border-color: var(--fpt-cyan); box-shadow: 0 0 0 3px rgba(0, 164, 184, 0.15); }

        select.form-control { padding-right: 14px; cursor: pointer; }

        .auth-meta { font-size: 12.5px; margin-bottom: 20px; color: #475569; }
        .terms-checkbox { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
        .terms-checkbox input { accent-color: var(--fpt-cyan); width: 16px; height: 16px; margin-top: 2px; cursor: pointer; }

        .btn-submit {
            width: 100%; background: linear-gradient(90deg, #0096aa, #00b4cf); color: #ffffff;
            border: none; padding: 13px; border-radius: 8px; font-family: var(--font-heading);
            font-size: 14.5px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 164, 184, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-submit:hover { background: linear-gradient(90deg, #008496, #0096aa); transform: translateY(-1px); }

        .auth-footer { text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-sub); border-top: 1px solid var(--border-color); padding-top: 20px; }
        .auth-footer a { color: var(--fpt-cyan); font-weight: 700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <a href="/staff" class="brand-badge"><i class="fa-solid fa-network-wired"></i> Everwin AI Platform</a>
            <div class="auth-title">Đăng Ký Tài Khoản Developer</div>
        </div>

        <form onsubmit="handleSignupSubmit(event)">
            <div class="form-group">
                <label class="form-label">Họ và Tên (Full Name)</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="signup-fullname" class="form-control" placeholder="Nam Lê" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Developer Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="signup-email" class="form-control" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" id="toggle-pwd-icon1" onclick="togglePasswordVisibility('signup-password', 'toggle-pwd-icon1')"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Xác nhận Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" id="signup-confirm-password" class="form-control" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" id="toggle-pwd-icon2" onclick="togglePasswordVisibility('signup-confirm-password', 'toggle-pwd-icon2')"></i>
                </div>
            </div>

            <div class="auth-meta">
                <label class="terms-checkbox">
                    <input type="checkbox" id="terms-checkbox" required>
                    <span>Tôi đồng ý với <a href="/terms" style="color:var(--fpt-cyan); font-weight:600;">Điều khoản dịch vụ</a> và <a href="/privacy" style="color:var(--fpt-cyan); font-weight:600;">Chính sách bảo mật</a> của Everwin AI Platform</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-user-plus"></i> ✨ TẠO TÀI KHOẢN MIỄN PHÍ
            </button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a href="/login">Đăng nhập ngay</a>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleSignupSubmit(e) {
            e.preventDefault();
            const fullName = document.getElementById('signup-fullname').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPwd = document.getElementById('signup-confirm-password').value;
            const role = 'staff';

            if (password !== confirmPwd) {
                alert('Mật khẩu xác nhận không trùng khớp!');
                return;
            }

            try {
                const res = await fetch('/v1/auth/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password, full_name: fullName, role })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Đăng ký thành công! Hãy đăng nhập để truy cập Console.');
                    window.location.href = '/login';
                } else {
                    alert('Đăng ký thất bại: ' + (data.detail || 'Có lỗi xảy ra'));
                }
            } catch (err) {
                alert('Lỗi kết nối server: ' + err.message);
            }
        }
    </script>
</body>
</html>
