services:
  - type: web
    name: aip-control-plane
    runtime: python
    buildCommand: uv sync
    startCommand: uv run uvicorn src.main:app --app-dir apps/control-plane --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: PYTHONPATH
        value: apps/control-plane:packages/common:packages/contracts:packages/sdk
      - key: ALLOW_IN_PROCESS_FALLBACK
        value: "true"
      - key: AIP_API_KEY
        value: "aip_live_valid_test_key_12345"
      - key: MASTER_PEPPER
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MINIO_ROOT_PASSWORD
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
