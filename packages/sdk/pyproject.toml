[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-sdk"
version = "1.0.0"
description = "AI Inference Platform (AIP) Official Enterprise Python SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aip_sdk"]
