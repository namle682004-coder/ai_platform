syntax = "proto3";

package aip.translation.v1;

import "common.proto";

service TranslationService {
  rpc Translate(TranslationRequest) returns (TranslationResponse);
  rpc GetHealth(aip.common.v1.HealthRequest) returns (aip.common.v1.HealthResponse);
  rpc Cancel(aip.common.v1.CancelRequest) returns (aip.common.v1.CancelResponse);
}

message TranslationRequest {
  string text = 1;
  string source_lang = 2;
  string target_lang = 3;
  string model_alias = 4;
}

message TranslationResponse {
  string status = 1;
  string translated_text = 2;
  string engine = 3;
  int64 duration_ms = 4;
  string source_lang = 5;
  string target_lang = 6;
  int64 latency_ms = 7;
}
