syntax = "proto3";

package aip.jobs.v1;

// Service definition for Async Distributed Job Management
service JobService {
  rpc SubmitJob(JobSubmitRequest) returns (JobStatusResponse);
  rpc GetJobStatus(JobQueryRequest) returns (JobStatusResponse);
  rpc CancelJob(JobCancelRequest) returns (JobCancelResponse);
}

message JobSubmitRequest {
  string job_type = 1;
  string alias_name = 2;
  string priority = 3;
  string webhook_url = 4;
  string idempotency_key = 5;
  bytes payload_json = 6;
}

message JobQueryRequest {
  string job_id = 1;
}

message JobCancelRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string job_type = 2;
  string alias_name = 3;
  string status = 4;
  int32 progress = 5;
  string error_message = 6;
  repeated string result_urls = 7;
  string created_at = 8;
  string updated_at = 9;
}

message JobCancelResponse {
  string job_id = 1;
  string message = 2;
}
