[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-contracts"
version = "0.1.0"
description = "Canonical Interface Contracts, Protocol Buffers and Schemas for AIP Platform (DCP Architecture)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
