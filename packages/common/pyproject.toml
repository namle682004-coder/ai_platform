[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "common"
version = "1.0.0"
description = "AIP Shared Enterprise Core Library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
    "argon2-cffi>=23.1.0",
    "motor>=3.6.0",
    "redis>=5.0.0",
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
