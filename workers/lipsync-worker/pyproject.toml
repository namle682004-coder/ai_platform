[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lipsync-worker"
version = "1.0.0"
description = "AIP Distributed LivePortrait LipSync Worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "common",
    "aio-pika>=9.4.0",
]

[tool.uv.sources]
common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
