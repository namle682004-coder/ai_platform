[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-callback-worker"
version = "0.1.0"
description = "Dedicated Webhook Callback Worker for AIP Platform with HMAC-SHA256 Signing and SSRF Protection (DCP Architecture)"
requires-python = ">=3.10"
dependencies = [
    "aio-pika>=9.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
