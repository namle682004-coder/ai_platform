[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-dispatcher-worker"
version = "0.1.0"
description = "Enterprise Asynchronous Distributed Task Dispatcher & Worker for AIP Platform (DCP Architecture)"
requires-python = ">=3.10"
dependencies = [
    "aio-pika>=9.0.0",
    "motor>=3.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
