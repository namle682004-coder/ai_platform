[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-engine"
version = "1.0.0"
description = "AIP vLLM Unified LLM Serving Engine Microservice (OpenAI-compatible)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "common",
    "aip-contracts",
    "grpcio>=1.62.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
common = { workspace = true }
aip-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
