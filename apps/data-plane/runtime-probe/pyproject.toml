[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aip-runtime-probe"
version = "1.0.0"
description = "AIP Kubernetes Sidecar Health & Readiness Probe for AI Runtimes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
