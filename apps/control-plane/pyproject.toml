[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-plane"
version = "1.0.0"
description = "AIP Enterprise Control Plane (FastAPI, DDD Architecture inspired by DCP Platform)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "common",
    "aip-contracts",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.4.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "motor>=3.6.0",
    "minio>=7.2.0",
    "grpcio>=1.62.0",
]

[tool.uv.sources]
common = { workspace = true }
aip-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]
