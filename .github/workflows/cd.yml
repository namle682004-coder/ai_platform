name: AIP CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  KUBECONFIG: $HOME/.kube/config

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: control-plane,      dockerfile: apps/control-plane/Dockerfile,                           port: 8000 }
          - { name: vllm-engine,        dockerfile: apps/data-plane/vllm-engine/Dockerfile,                   port: 8001 }
          - { name: stt-server,         dockerfile: apps/data-plane/stt-server/Dockerfile,                    port: 8002 }
          - { name: translation-server, dockerfile: apps/data-plane/translation-server/Dockerfile,            port: 8003 }
          - { name: ocr-server,         dockerfile: apps/data-plane/ocr-server/Dockerfile,                    port: 8004 }
          - { name: moderation-server,  dockerfile: apps/data-plane/moderation-server/Dockerfile,             port: 8006 }
          - { name: tts-adapter,        dockerfile: apps/data-plane/tts-adapter/Dockerfile,                   port: 8007 }
          - { name: dispatcher-worker,  dockerfile: apps/dispatcher-worker/Dockerfile, port: 0 }
          - { name: callback-worker,    dockerfile: apps/callback-worker/Dockerfile,   port: 0 }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy-staging:
    name: Deploy Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.environment == 'staging')
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl & helm
        uses: azure/setup-kubectl@v3
      - uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        id: kubeconfig
        env:
          KUBE_CONFIG: ""  # Configure via GitHub Secrets when deploying to Kubernetes
        run: |
          mkdir -p $HOME/.kube
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG_STAGING not set — skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$KUBE_CONFIG" | base64 -d > $KUBECONFIG
            chmod 600 $KUBECONFIG
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          helm upgrade --install aip-infra deploy/helm/aip-infra \
            -n aip-infra --create-namespace --atomic --wait --timeout 5m

          helm upgrade --install aip-control deploy/helm/aip-control \
            -n aip-control --create-namespace --atomic --wait --timeout 5m \
            --set image.tag=${{ github.sha }}

          helm upgrade --install aip-runtimes deploy/helm/aip-runtimes \
            -n aip-multimodal --create-namespace --atomic --wait --timeout 10m \
            --set vllm.image.tag=${{ github.sha }} \
            --set stt.image.tag=${{ github.sha }} \
            --set tts.image.tag=${{ github.sha }} \
            --set translation.image.tag=${{ github.sha }} \
            --set moderation.image.tag=${{ github.sha }} \
            --set ocr.image.tag=${{ github.sha }}

      - name: Health check
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          kubectl rollout status deployment/aip-gateway -n aip-control --timeout=120s
          kubectl rollout status deployment -n aip-multimodal --timeout=300s

  deploy-production:
    name: Deploy Production
    needs: build-and-push          # ✅ sửa: không phụ thuộc staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: ${{ inputs.environment }}        # require reviewers trong GitHub repo settings
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3
      - uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        id: kubeconfig
        env:
          KUBE_CONFIG: ""  # Configure via GitHub Secrets when deploying to Kubernetes
        run: |
          mkdir -p $HOME/.kube
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG_PRODUCTION not set — skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$KUBE_CONFIG" | base64 -d > $KUBECONFIG
            chmod 600 $KUBECONFIG
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          helm upgrade --install aip-control deploy/helm/aip-control \
            -n aip-control --atomic --wait --timeout 5m \
            --set image.tag=${{ github.sha }} \
            --set replicaCount=5

          helm upgrade --install aip-runtimes deploy/helm/aip-runtimes \
            -n aip-multimodal --atomic --wait --timeout 10m \
            --set vllm.image.tag=${{ github.sha }} \
            --set stt.image.tag=${{ github.sha }} \
            --set tts.image.tag=${{ github.sha }} \
            --set translation.image.tag=${{ github.sha }} \
            --set moderation.image.tag=${{ github.sha }} \
            --set ocr.image.tag=${{ github.sha }}

      - name: Health check
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          kubectl rollout status deployment/aip-gateway -n aip-control --timeout=180s
          kubectl rollout status deployment -n aip-multimodal --timeout=300s