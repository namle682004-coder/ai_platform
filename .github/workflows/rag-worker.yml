name: "Worker: RAG Knowledge Ingestion"

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'solutions/rag/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - '.github/workflows/rag-worker.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'solutions/rag/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - '.github/workflows/rag-worker.yml'
  workflow_dispatch:

concurrency:
  group: rag-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate & Test (RAG Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ".:packages/common:packages/contracts:solutions/rag:solutions/rag/src:platform/gateway"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & UV
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install -e packages/common \
                         -e packages/contracts \
                         -e solutions/rag \
                         pytest httpx ruff pypdf python-docx

      - name: Lint with Ruff
        shell: bash
        run: uv run ruff check solutions/rag/

      - name: Unit Tests (RAG Parsing, Chunking & Retrieval)
        shell: bash
        run: |
          uv run pytest tests/test_rag_pipeline.py -k "not test_swimlane_async_ingestion_and_rag_chat_e2e" --collect-only -q > /dev/null
          uv run pytest tests/test_rag_pipeline.py -k "not test_swimlane_async_ingestion_and_rag_chat_e2e" --tb=short

  build-image:
    name: Docker Image (RAG Worker)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build & Push Container
        uses: ./.github/actions/docker-build
        with:
          service-name: rag-worker
          dockerfile: solutions/rag/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
