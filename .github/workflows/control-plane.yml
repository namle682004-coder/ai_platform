name: "Service: Control Plane"

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'apps/control-plane/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - 'packages/sdk/**'
      - '.github/workflows/control-plane.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'apps/control-plane/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - 'packages/sdk/**'
      - '.github/workflows/control-plane.yml'
  workflow_dispatch:

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate & Test (Control Plane)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MASTER_PEPPER: "test-master-pepper-for-testing-purposes-min-32-chars"
      JWT_SECRET: "test-jwt-secret-for-testing-purposes-min-32-chars"
      MONGO_URI: "mongodb://localhost:27017/test_ai_platform"
      MINIO_ROOT_PASSWORD: "minioadmin123"
      PYTHONPATH: ".:packages/common:packages/contracts:packages/sdk:apps/control-plane:apps/control-plane/src"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & UV
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install -e packages/common \
                         -e packages/contracts \
                         -e packages/sdk \
                         -e apps/control-plane \
                         pytest httpx ruff python-multipart

      - name: Lint with Ruff
        shell: bash
        run: uv run ruff check apps/control-plane/ packages/

      - name: Unit & Integration Tests
        shell: bash
        run: |
          uv run pytest tests/test_gateway.py \
                        tests/test_security.py \
                        tests/test_srs_compliance.py \
                        tests/test_srs_section5_contract.py \
                        tests/test_vietnamese_id_recognition.py \
                        tests/test_usage_metering.py \
                        tests/test_metrics.py \
                        --tb=short

      - name: Validate & Lint Helm Charts
        shell: bash
        run: |
          helm lint deploy/helm/aip-control
          helm lint deploy/helm/aip-runtimes
          helm lint deploy/helm/aip-infra
          helm template test-control deploy/helm/aip-control
          helm template test-runtimes deploy/helm/aip-runtimes

      - name: Export & verify OpenAPI
        shell: bash
        run: |
          uv run python scripts/export_api_assets.py
          test -f openapi/openapi.json
          test -f openapi/aip_postman_collection.json
          test -f openapi/aip_documentation.html

  build-image:
    name: Docker Image (Control Plane)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build & Push Container
        uses: ./.github/actions/docker-build
        with:
          service-name: control-plane
          dockerfile: apps/control-plane/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
