name: "GitOps: Staging & Production Deployment"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.environment == 'staging')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl & helm
        uses: azure/setup-kubectl@v3
      - uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        id: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING || secrets.KUBE_CONFIG }}
        run: |
          mkdir -p $HOME/.kube
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG_STAGING not set in GitHub Secrets — skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Staging Charts
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          kubectl apply -f deploy/k8s/namespaces/namespaces.yaml

          helm upgrade --install aip-infra deploy/helm/aip-infra \
            -n aip-infra --create-namespace --atomic --wait --timeout 5m

          helm upgrade --install aip-control deploy/helm/aip-control \
            -n aip-control --create-namespace --atomic --wait --timeout 5m \
            --set image.tag=${{ github.sha }}

          helm upgrade --install aip-runtimes deploy/helm/aip-runtimes \
            -n aip-multimodal --create-namespace --atomic --wait --timeout 10m \
            --set vllm.image.tag=${{ github.sha }} \
            --set stt.image.tag=${{ github.sha }} \
            --set tts.image.tag=${{ github.sha }} \
            --set translation.image.tag=${{ github.sha }} \
            --set moderation.image.tag=${{ github.sha }} \
            --set ocr.image.tag=${{ github.sha }}

      - name: Health check
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          kubectl rollout status deployment/aip-gateway -n aip-control --timeout=120s
          kubectl rollout status deployment -n aip-multimodal --timeout=300s

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3
      - uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        id: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_PRODUCTION || secrets.KUBE_CONFIG }}
        run: |
          mkdir -p $HOME/.kube
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG_PRODUCTION not set in GitHub Secrets — skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Production Charts
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          kubectl apply -f deploy/k8s/namespaces/namespaces.yaml

          helm upgrade --install aip-control deploy/helm/aip-control \
            -n aip-control --atomic --wait --timeout 5m \
            --set image.tag=${{ github.sha }} \
            --set replicaCount=5

          helm upgrade --install aip-runtimes deploy/helm/aip-runtimes \
            -n aip-multimodal --atomic --wait --timeout 10m \
            --set vllm.image.tag=${{ github.sha }} \
            --set stt.image.tag=${{ github.sha }} \
            --set tts.image.tag=${{ github.sha }} \
            --set translation.image.tag=${{ github.sha }} \
            --set moderation.image.tag=${{ github.sha }} \
            --set ocr.image.tag=${{ github.sha }}

      - name: Health check
        if: steps.kubeconfig.outputs.skip != 'true'
        run: |
          kubectl rollout status deployment/aip-gateway -n aip-control --timeout=180s
          kubectl rollout status deployment -n aip-multimodal --timeout=300s
