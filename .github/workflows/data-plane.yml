name: "Data Plane: Inference Runtimes"

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'apps/data-plane/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - '.github/workflows/data-plane.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'apps/data-plane/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - '.github/workflows/data-plane.yml'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Force build all data-plane images"
        type: boolean
        default: false

concurrency:
  group: data-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter-runtimes:
    name: Detect Changed Runtimes
    runs-on: ubuntu-latest
    outputs:
      vllm: ${{ steps.filter.outputs.vllm }}
      translation: ${{ steps.filter.outputs.translation }}
      stt: ${{ steps.filter.outputs.stt }}
      ocr: ${{ steps.filter.outputs.ocr }}
      moderation: ${{ steps.filter.outputs.moderation }}
      tts: ${{ steps.filter.outputs.tts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vllm:
              - 'apps/data-plane/vllm-engine/**'
              - 'packages/common/**'
              - 'packages/contracts/**'
            translation:
              - 'apps/data-plane/translation-server/**'
              - 'packages/common/**'
              - 'packages/contracts/**'
            stt:
              - 'apps/data-plane/stt-server/**'
              - 'packages/common/**'
              - 'packages/contracts/**'
            ocr:
              - 'apps/data-plane/ocr-server/**'
              - 'packages/common/**'
              - 'packages/contracts/**'
            moderation:
              - 'apps/data-plane/moderation-server/**'
              - 'packages/common/**'
              - 'packages/contracts/**'
            tts:
              - 'apps/data-plane/tts-adapter/**'
              - 'packages/common/**'
              - 'packages/contracts/**'

  validate-and-test:
    name: Lint & Test Changed Runtimes
    needs: filter-runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ".:packages/common:packages/contracts:apps/data-plane/vllm-engine:apps/data-plane/translation-server:apps/data-plane/stt-server:apps/data-plane/ocr-server:apps/data-plane/moderation-server:apps/data-plane/tts-adapter:apps/control-plane"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & UV
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install -e packages/common \
                         -e packages/contracts \
                         -e apps/data-plane/vllm-engine \
                         -e apps/data-plane/translation-server \
                         -e apps/data-plane/stt-server \
                         -e apps/data-plane/ocr-server \
                         -e apps/data-plane/moderation-server \
                         -e apps/data-plane/tts-adapter \
                         pytest httpx ruff python-multipart

      - name: Lint Data Plane with Ruff
        shell: bash
        run: uv run ruff check apps/data-plane/

      - name: Test Translation (if changed)
        if: needs.filter-runtimes.outputs.translation == 'true' || inputs.force_build_all == true
        shell: bash
        run: uv run pytest tests/test_translation.py --tb=short

      - name: Test vLLM (if changed)
        if: needs.filter-runtimes.outputs.vllm == 'true' || inputs.force_build_all == true
        shell: bash
        run: uv run pytest tests/test_vllm.py --tb=short

      - name: Test STT (if changed)
        if: needs.filter-runtimes.outputs.stt == 'true' || inputs.force_build_all == true
        shell: bash
        run: uv run pytest tests/test_stt.py --tb=short

      - name: Test OCR (if changed)
        if: needs.filter-runtimes.outputs.ocr == 'true' || inputs.force_build_all == true
        shell: bash
        run: uv run pytest tests/test_ocr.py tests/test_vietnamese_id_recognition.py --tb=short

      - name: Test Moderation (if changed)
        if: needs.filter-runtimes.outputs.moderation == 'true' || inputs.force_build_all == true
        shell: bash
        run: uv run pytest tests/test_moderation.py --tb=short

      - name: Test TTS (if changed)
        if: needs.filter-runtimes.outputs.tts == 'true' || inputs.force_build_all == true
        shell: bash
        run: uv run pytest tests/test_tts.py --tb=short

  build-translation:
    name: "Image: translation-server"
    needs: [filter-runtimes, validate-and-test]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && (needs.filter-runtimes.outputs.translation == 'true' || inputs.force_build_all == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build
        with:
          service-name: translation-server
          dockerfile: apps/data-plane/translation-server/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  build-vllm:
    name: "Image: vllm-engine"
    needs: [filter-runtimes, validate-and-test]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && (needs.filter-runtimes.outputs.vllm == 'true' || inputs.force_build_all == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build
        with:
          service-name: vllm-engine
          dockerfile: apps/data-plane/vllm-engine/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  build-stt:
    name: "Image: stt-server"
    needs: [filter-runtimes, validate-and-test]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && (needs.filter-runtimes.outputs.stt == 'true' || inputs.force_build_all == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build
        with:
          service-name: stt-server
          dockerfile: apps/data-plane/stt-server/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  build-ocr:
    name: "Image: ocr-server"
    needs: [filter-runtimes, validate-and-test]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && (needs.filter-runtimes.outputs.ocr == 'true' || inputs.force_build_all == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build
        with:
          service-name: ocr-server
          dockerfile: apps/data-plane/ocr-server/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  build-moderation:
    name: "Image: moderation-server"
    needs: [filter-runtimes, validate-and-test]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && (needs.filter-runtimes.outputs.moderation == 'true' || inputs.force_build_all == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build
        with:
          service-name: moderation-server
          dockerfile: apps/data-plane/moderation-server/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  build-tts:
    name: "Image: tts-adapter"
    needs: [filter-runtimes, validate-and-test]
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && (needs.filter-runtimes.outputs.tts == 'true' || inputs.force_build_all == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-build
        with:
          service-name: tts-adapter
          dockerfile: apps/data-plane/tts-adapter/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
