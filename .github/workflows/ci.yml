name: AIP Lightweight Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Lint, Test & OpenAPI Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MODE: "true"
      VLLM_TEST_MODE: "true"
      MASTER_PEPPER: "test-master-pepper-for-testing-purposes-min-32-chars"
      JWT_SECRET: "test-jwt-secret-for-testing-purposes-min-32-chars"
      MONGO_URI: "mongodb://localhost:27017/test_ai_platform"
      MINIO_ROOT_PASSWORD: "minioadmin123"
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
      REDIS_URL: "redis://localhost:6379/0"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install UV (with cache)
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python 3.10
        run: uv python install 3.10 && uv python pin 3.10

      - name: Install monorepo deps
        run: |
          uv venv --python 3.10
          uv pip install -e packages/common \
                         -e packages/contracts \
                         -e packages/sdk \
                         -e apps/control-plane \
                         -e apps/data-plane/vllm-engine \
                         -e apps/data-plane/translation-server \
                         -e apps/data-plane/stt-server \
                         -e apps/data-plane/moderation-server \
                         -e apps/dispatcher-worker \
                         -e apps/callback-worker \
                         -e apps/image-worker \
                         pytest httpx ruff python-multipart

      - name: Ruff lint
        run: uv run ruff check apps/ packages/ tests/ scripts/

      - name: Pytest
        env:
          TEST_MODE: "true"
          VLLM_TEST_MODE: "true"
          PYTHONPATH: ".:packages/common:packages/contracts:packages/sdk:apps/control-plane:apps/control-plane/src:apps/dispatcher-worker:apps/callback-worker:apps/image-worker:apps/data-plane/translation-server:apps/data-plane/vllm-engine"
        run: uv run pytest -v

      - name: Export & verify OpenAPI assets
        env:
          PYTHONPATH: ".:packages/common:packages/contracts:packages/sdk:apps/control-plane:apps/control-plane/src"
        run: |
          uv run python scripts/export_api_assets.py
          test -f openapi/openapi.json
          test -f openapi/aip_postman_collection.json
          test -f openapi/aip_documentation.html
          echo "✅ All export assets verified."

      - name: Upload OpenAPI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-assets
          path: openapi/
          retention-days: 7