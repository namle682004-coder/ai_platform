name: "Worker: Dispatcher"

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'platform/workers/dispatcher/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - '.github/workflows/dispatcher.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'platform/workers/dispatcher/**'
      - 'packages/common/**'
      - 'packages/contracts/**'
      - '.github/workflows/dispatcher.yml'
  workflow_dispatch:

concurrency:
  group: dispatcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate & Test (Dispatcher Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ".:packages/common:packages/contracts:platform/workers/dispatcher:platform/workers/dispatcher/src:platform/gateway"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & UV
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        shell: bash
        run: |
          uv pip install -e packages/common \
                         -e packages/contracts \
                         -e platform/workers/dispatcher \
                         pytest httpx ruff

      - name: Lint with Ruff
        shell: bash
        run: uv run ruff check platform/workers/dispatcher/

      - name: Dispatcher Worker Tests
        shell: bash
        run: |
          uv run pytest tests/test_dispatcher_worker.py tests/test_dcp_modules.py tests/test_dcp_enhancements.py --collect-only -q > /dev/null
          uv run pytest tests/test_dispatcher_worker.py tests/test_dcp_modules.py tests/test_dcp_enhancements.py --tb=short

  build-image:
    name: Docker Image (Dispatcher Worker)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build & Push Container
        uses: ./.github/actions/docker-build
        with:
          service-name: dispatcher-worker
          dockerfile: platform/workers/dispatcher/Dockerfile
          image-prefix: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: "true"
