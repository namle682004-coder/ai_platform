name: "Build and Push Service Container"
description: "Builds Docker image with layer caching via GitHub Actions cache backend and pushes to GHCR"

inputs:
  service-name:
    description: "Name of the service (e.g. callback-worker, control-plane)"
    required: true
  dockerfile:
    description: "Path to Dockerfile (e.g. apps/callback-worker/Dockerfile)"
    required: true
  registry:
    description: "Container registry"
    required: false
    default: "ghcr.io"
  image-prefix:
    description: "Image prefix / repository"
    required: true
  github-token:
    description: "GitHub Token for GHCR authentication"
    required: true
  push:
    description: "Whether to push the image to registry"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Registry
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push == 'true' }}
        provenance: true
        sbom: true
        tags: |
          ${{ inputs.registry }}/${{ inputs.image-prefix }}/${{ inputs.service-name }}:${{ github.sha }}
          ${{ inputs.registry }}/${{ inputs.image-prefix }}/${{ inputs.service-name }}:latest
        cache-from: type=gha,scope=${{ inputs.service-name }}
        cache-to:   type=gha,mode=max,scope=${{ inputs.service-name }}
