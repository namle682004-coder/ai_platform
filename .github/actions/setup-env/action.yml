name: "Setup AIP Python & UV Environment"
description: "Configures Python 3.10 with astral-sh/setup-uv, persistent wheel cache, and virtualenv"

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.10"

runs:
  using: "composite"
  steps:
    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"

    - name: Set up Python
      shell: bash
      run: |
        uv python install ${{ inputs.python-version }}
        uv python pin ${{ inputs.python-version }}
        uv venv --python ${{ inputs.python-version }}
