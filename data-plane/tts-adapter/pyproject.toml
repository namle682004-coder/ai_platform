[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-adapter"
version = "1.0.0"
description = "AIP Text-to-Speech Microservice Adapter (viXTTS / OpenVoice)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
