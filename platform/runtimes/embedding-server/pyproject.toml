[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedding-server"
version = "1.0.0"
description = "AIP Embedding (BGE-M3) & Reranking (BGE-Reranker-v2-m3) Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.0.0",
    "FlagEmbedding>=1.3.0",
    "torch>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
