[project]
name = "ai-platform"
version = "1.0.0"
description = "AI Inference Platform (AIP) - Enterprise Microservices UV Workspace Monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "common",
    "aip-contracts",
    "aip-sdk",
    "control-plane",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "python-multipart>=0.0.9",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/control-plane",
    "apps/data-plane/*",
    "apps/dispatcher-worker",
    "apps/callback-worker",
    "apps/image-worker",
    "apps/video-worker",
    "apps/lipsync-worker",
    "packages/*",
]

[tool.uv.sources]
common = { workspace = true }
control-plane = { workspace = true }
aip-sdk = { workspace = true }
aip-contracts = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["packages/contracts/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "B006", "E501", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [
    ".",
    "apps/control-plane",
    "apps/control-plane/src",
    "packages/common",
    "packages/contracts",
    "packages/sdk",
    "apps/data-plane/vllm-engine",
    "apps/data-plane/translation-server",
    "apps/data-plane/stt-server",
    "apps/data-plane/moderation-server",
    "apps/data-plane/tts-adapter",
    "apps/data-plane/ocr-server",
    "apps/dispatcher-worker",
    "apps/dispatcher-worker/src",
    "apps/callback-worker",
    "apps/image-worker",
]
