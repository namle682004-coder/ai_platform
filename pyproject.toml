[project]
name = "ai-platform"
version = "1.0.0"
description = "AI Inference Platform (AIP) - Enterprise Microservices UV Workspace Monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.uv.workspace]
members = [
    "control-plane",
    "data-plane/*",
    "workers/orchestration/*",
    "workers/gpu-workloads/*",
    "packages/*",
]

[tool.uv.sources]
common = { workspace = true }
control-plane = { workspace = true }
aip-sdk = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "B006", "E501", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [
    ".",
    "control-plane",
    "control-plane/src",
    "packages/common",
    "packages/contracts",
    "packages/sdk",
    "data-plane/vllm-engine",
    "data-plane/translation-server",
    "data-plane/stt-server",
    "data-plane/moderation-server",
    "data-plane/tts-adapter",
    "data-plane/ocr-server",
    "workers/orchestration/dispatcher-worker",
    "workers/orchestration/callback-worker",
    "workers/gpu-workloads/image-worker",
]
