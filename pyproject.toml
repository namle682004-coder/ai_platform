[project]
name = "ai-platform"
version = "1.0.0"
description = "AI Inference Platform (AIP) - Enterprise Microservices UV Workspace Monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "common",
    "aip-contracts",
    "aip-sdk",
    "control-plane",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "python-multipart>=0.0.9",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "flashrank>=0.2.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "platform/gateway",
    "solutions/rag",
    "platform/runtimes/*",
    "platform/workers/dispatcher",
    "platform/workers/callback",
    "platform/workers/media/*",
    "packages/*",
]

[tool.uv.sources]
common = { workspace = true }
control-plane = { workspace = true }
aip-sdk = { workspace = true }
aip-contracts = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["packages/contracts/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "B006", "E501", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [
    ".",
    "platform/gateway",
    "platform/gateway/src",
    "packages/common",
    "packages/contracts",
    "packages/sdk",
    "platform/runtimes/vllm-engine",
    "platform/runtimes/translation-server",
    "platform/runtimes/stt-server",
    "platform/runtimes/moderation-server",
    "platform/runtimes/tts-adapter",
    "platform/runtimes/ocr-server",
    "platform/workers/dispatcher",
    "platform/workers/dispatcher/src",
    "platform/workers/callback",
    "platform/workers/media/image-worker",
    "solutions/rag",
    "solutions/ekyc",
    "solutions/voice",
]
